<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>내장 객체</h1>
    <p>자바스크립트에서 제공하는 기본 내장 객체들</p>

    <h2>Math 객체</h2>
    <p>수학 계산 관련 함수들</p>
    <script src="./07-built-in-object.js"></script>

    <h2>Date 객체</h2>
    <p>날짜 / 시간 생성 및 조화</p>

    <h2>String 객체 (자바 개념)</h2>
    <p>문자열 관련 함수들</p>

    <h2>Timer</h2>
    <p>지연 및 반복 실행</p>

    <h2>JSON 객체</h2>
    <p>객체를 문자열로 변환하고 다시 복원</p>

    <h1>BOM</h1>
    <p>브라우저에서 제공하는 객체 = Window 객체 = 최상위 객체</p>

    <button
      type="button"
      onclick="window.prompt('이름을 입력해주세요')"
    ></button>

    <h2>location 객체</h2>
    <p>현재 페이지의 Url 정보 및 이동</p>

    <button onclick="location.reload()">새로고침</button>

    <h2>history 객체</h2>
    <button onclick="history.back">뒤로가기</button>

    <script src="./07-built-in-object.js"></script>
  </body>
</html>
