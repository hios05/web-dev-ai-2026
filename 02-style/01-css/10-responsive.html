<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="10-responsive.css" />
  </head>
  <body>
    <h1>Media Query</h1>
    <p>미디어쿼리(Media Query)는 화면 크기에 따라 스타일을 바꾼다.</p>
    <!--예시: 화면을 줄일 때의 유튜브 인터페이스 변화-->

    <h2>Flex 예시</h2>
    <div class="flex-container">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
    </div>

    <h2>Grid 예시</h2>
    <div class="grid-container">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
    </div>

    <h2>aspect-ratio</h2>

    <p>높이 계산 없이 비율 고정</p>
    <div class="ratio-grid">
      <div class="ratio-card">16:9</div>
      <div class="ratio-card">4:3</div>
      <div class="ratio-card">1:1</div>
    </div>
  </body>
</html>
