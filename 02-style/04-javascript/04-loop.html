<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>반복문</h1>

    <script>
      //1 ~ 10까지 출력
      //초기값이, 조건에 만족할 때까지, 증감식을 반복함
      /*for(초기값;조건식;증감식) {
반복문 조건에 해당되는만큼 실행
}*/
      for (let i = 1; i <= 10; i++) {
        console.log(i);
      }
    </script>

    <h2>1. 전위 / 후위 연산자</h2>

    <script>
      let num = 1;
      num = num + 1;
      console.log(num); //2
      //num = num+1 = ++num, num++
      //num = num-1 = --num, num--
      //++num , --num : 전위 연산자 (먼저 계산하고 나중에 출력)
      //num++ , num-- : 후위 연산자 (먼저 출력하고 나중에 계산)

      console.log(++num); //3
      console.log(num++); //결과값 : 3, num : 4
      console.log(num); //4
      console.log(num--); //결과값 : 4, num : 3
      console.log(num); //3
    </script>

    <h2>2. 복합대입연산자</h2>

    <script>
      num = num + 3;
      num += 3;
      num -= 2; //num = num - 2;
      num *= 5; //num = num * 5;
      num /= 4; //num = num / 4;
      console.log(num);

      for (let i = 30; i > 0; i -= 3) {
        console.log(i);
      }
    </script>

    <h2>배열과 for문</h2>

    <script>
      const movies = [
        "헤어질 결심",
        "시스터",
        "장화홍련",
        "아가씨",
        "신과 함께:인과 연",
      ];

      for (let i = 0; i <= 5; i++) console.log(movies[i]);
      //i <= 4는 i < 5 와 같음
      //movies length는 배열의 길이, 마지막 인덱스는 길이 - 1

      for (let i = 0; i < movies.length - 1; i++) {
        console.log(movies[i]);
      }

      //for .. in : for (인덱스 in 배열) {}
      for (let index in movies) {
        console.log(movies[index]);
      }

      //for .. of : for(값 of 배열) {}
      for (let value of movies) {
        console.log(movies[value]);
      }
    </script>

    <h2>4. while문</h2>

    <script>
      /*
    while(조건)
    조건이 true면 계속 실행됨*/

      let i = 1;
      while (i <= 10) {
        console.log(i);
        i++;
      }

      // 무한루프 - 일부로 사용
      // while (true) { const input = prompt("종료햐려면 Q를 입력해주세요");
      //break를 만나면 해당 부분을 빠져나간다.
      //if문 안에 구문이 한 줄인 경우 {} 생략 가능
      // if (input === "Q") break;
    </script>

    <h2>5. break / continue</h2>

    <script>
      for (let i = 1; i < 10; i++) {
        //break : 해당하는 조건일 때 종료
        if (i === 7) break;

        //continue : 해당하는 조건을 건너뜀
        if (i === 2) continue;

        console.log(i);
      }
    </script>

    <h2>6. 2차원 배열 + 중첩 for문</h2>
    <script>
      const arr = [
        [1, 2, 3],
        [4, 5, 6],
        [7, 8, 9],
      ];

      //반복문을 사용해서 1 ~ 9까지 하나씩 나오게 하기

      for (let j = 0; j <= 3; j++)
        for (let i = 0; i < 10; i++) {
          console.log(arr[j][i]);
        }

      //for..of

      for (let i of arr) {
        console.log(arr[i]);
      }
    </script>
  </body>
</html>
