<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./practice10-register.css" />
  </head>
  <body>
    <div class="sign-up">
      <h1>회원가입</h1>
      <div class="sign-up-text">
        <input type="text" id="id" placeholder="아이디를 입력해주세요" />
        <span id="idCheck">
          영문자로 시작하고 영문자와 숫자 조합으로 4~12자 이내
        </span>
      </div>
      <div class="sign-up-text">
        <input type="text" id="pwd" placeholder="비밀번호를 입력해주세요" />
        <span id="pwdCheck">영문자, 숫자, 특수문자 조합으로 8~15자 이내</span>
      </div>
      <div class="sign-up-text">
        <input
          type="text"
          id="pwdDouble"
          placeholder="비밀번호를 다시 한 번 입력해주세요"
        />
        <span id="pwdDoubleCheck">위 비밀번호와 동일하게</span>
      </div>
      <div class="sign-up-text">
        <input type="text" id="username" placeholder="이름을 입력해주세요" />
        <span id="nameCheck">한글 2자 이상</span>
      </div>
      <div class="sign-up-text">
        <input type="text" id="email" placeholder="이메일을 입력해주세요" />
        <span id="emailCheck">이메일 형식</span>
      </div>
      <div class="sign-up-text">
        <input type="text" id="phone" placeholder="전화번호를 입력해주세요" />
        <span id="phoneCheck">전화번호 형식</span>
      </div>
      <div class="btn-group">
        <button id="signup">회원가입</button>
        <button id="cancel" type="reset">취소</button>
      </div>
    </div>
    <script src="./practice10-register.js"></script>
  </body>
</html>
